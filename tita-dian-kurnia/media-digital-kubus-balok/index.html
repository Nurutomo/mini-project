<script>
const D={"cp": "Peserta didik dapat mengonstruksi dan mengurai bangun ruang (kubus, balok, dan gabungannya) dan mengenali visualisasi spasial (bagian depan, atas, dan samping). Peserta didik dapat membandingkan karakteristik antarbangun datar dan antarbangun ruang. Peserta didik dapat menentukan lokasi pada peta yang menggunakan sistem berpetak.", "tp": ["Peserta didik mampu menganalisis perbedaan bangun ruang dan bangun datar, serta mengenal unsur-unsur kubus dan balok (titik sudut, rusuk, dan sisi/bidang).", "Peserta didik mampu membuat dan menggambar jaring-jaring kubus dan balok.", "Peserta didik dapat mengonstruksi (membangun) dan mengurai (membongkar) bangun ruang kubus, balok, serta gabungannya.", "Peserta didik mampu mengenali visualisasi spasial dari arah depan, atas, dan samping.", "Peserta didik mampu memahami konsep pangkat tiga atau bilangan kubik dan menghitung volume kubus."], "mc": [{"n": 1, "q": "Rani mendapat tugas membuat kotak hadiah berbentuk kubus dari karton. Kotak tersebut memiliki bagian atas, bawah, depan, belakang, kiri, dan kanan. Agar kotak dapat berdiri dengan kokoh, Rani perlu mengetahui jumlah seluruh sisi yang dimiliki kubus. Jumlah sisi kubus adalah ....", "o": ["4 sisi", "5 sisi", "6 sisi", "8 sisi"], "a": "C"}, {"n": 2, "q": "Pak Guru membawa sebuah kotak berbentuk balok untuk menyimpan buku. Ketika diperiksa, kotak tersebut mempunyai beberapa garis pertemuan antara dua sisinya. Garis pertemuan tersebut disebut rusuk. Berapa jumlah rusuk yang dimiliki balok?", "o": ["8 rusuk", "10 rusuk", "12 rusuk", "14 rusuk"], "a": "C"}, {"n": 3, "q": "Dika membuat kotak penyimpanan berbentuk kubus dengan panjang rusuk 5 cm. Ia ingin mengetahui banyak ruang yang dapat ditampung oleh kotak tersebut. Volume kotak milik Dika adalah ....", "o": ["25 cm³", "75 cm³", "100 cm³", "125 cm³"], "a": "D"}, {"n": 4, "q": "Ibu mempunyai dua benda, yaitu selembar kertas berbentuk persegi dan kotak sepatu berbentuk balok. Ibu meminta anaknya menjelaskan perbedaan kedua benda tersebut. Pernyataan yang paling tepat adalah ....", "o": ["Keduanya mempunyai panjang, lebar, dan tinggi.", "Persegi merupakan bangun datar, sedangkan balok merupakan bangun ruang.", "Persegi memiliki volume, sedangkan balok tidak.", "Keduanya mempunyai enam sisi berbentuk persegi."], "a": "B"}, {"n": 5, "q": "Beni menyusun beberapa kubus kecil untuk membuat sebuah kubus besar. Panjang setiap rusuk kubus besar adalah 4 satuan. Jika seluruh bagian terisi penuh, banyak kubus satuan yang diperlukan adalah ....", "o": ["16 kubus satuan", "32 kubus satuan", "48 kubus satuan", "64 kubus satuan"], "a": "D"}, {"n": 6, "q": "Sinta menggambar sebuah jaring-jaring kubus yang terdiri atas enam persegi sama besar. Setelah dilipat, ternyata ada dua bagian yang saling bertumpuk sehingga kotak tidak dapat terbentuk dengan benar. Kesimpulan yang tepat adalah ....", "o": ["Semua susunan enam persegi pasti menjadi kubus.", "Jaring-jaring kubus harus memiliki susunan persegi yang tepat agar dapat dilipat menjadi kubus.", "Kubus hanya membutuhkan lima persegi.", "Jaring-jaring kubus harus berbentuk lingkaran."], "a": "B"}, {"n": 7, "q": "Andi memiliki dua bangun ruang. Bangun pertama berbentuk kubus, sedangkan bangun kedua berbentuk balok. Ia mengamati bahwa keduanya mempunyai 8 titik sudut dan 12 rusuk. Namun, bentuk sisi keduanya tidak selalu sama. Analisis yang benar adalah ....", "o": ["Semua sisi kubus dan balok berbentuk lingkaran.", "Kubus mempunyai sisi berbentuk persegi, sedangkan balok mempunyai sisi berbentuk persegi panjang atau persegi.", "Kubus tidak memiliki titik sudut.", "Balok mempunyai lebih banyak rusuk daripada kubus."], "a": "B"}, {"n": 8, "q": "Dalam tugas kelompok, siswa menyusun tiga kubus dengan ukuran sama secara berjajar ke arah kanan. Jika dilihat dari depan, susunan tersebut terlihat seperti tiga persegi berjajar. Mengapa tampilan dari depan berbeda dengan tampilan dari atas?", "o": ["Karena bangun berubah bentuk ketika dilihat.", "Karena setiap arah pandang memperlihatkan bagian bangun yang berbeda.", "Karena kubus tidak mempunyai sisi.", "Karena bagian atas selalu berbentuk segitiga."], "a": "B"}, {"n": 9, "q": "Sebuah kotak berbentuk balok dibungkus menggunakan kertas. Raka menggambar enam persegi panjang yang ukurannya sama untuk membuat jaring-jaringnya. Namun, ketika dicoba, gambar tersebut tidak sesuai dengan bentuk kotak. Penyebab yang paling mungkin adalah ....", "o": ["Semua sisi balok harus memiliki ukuran yang sama.", "Ukuran sisi-sisi balok harus disesuaikan dengan panjang, lebar, dan tinggi balok.", "Balok tidak dapat dibuat dari jaring-jaring.", "Balok hanya memiliki empat sisi."], "a": "B"}, {"n": 10, "q": "Kelompok A menyusun empat kubus kecil dengan posisi berjajar. Kelompok B menyusun empat kubus kecil dengan posisi dua di bawah dan dua di atas. Kedua kelompok menggunakan jumlah kubus yang sama. Kesimpulan yang tepat adalah ....", "o": ["Kedua susunan pasti memiliki tampilan depan yang sama.", "Bentuk susunan dapat berbeda meskipun jumlah kubus yang digunakan sama.", "Kelompok A menggunakan lebih banyak kubus.", "Kelompok B tidak dapat membentuk bangun ruang."], "a": "B"}, {"n": 11, "q": "Pada sebuah denah sekolah berpetak, perpustakaan berada di titik (2,3), sedangkan ruang kelas berada di titik (5,3). Jika setiap petak mewakili satu langkah ke arah kanan atau kiri, bagaimana posisi ruang kelas dari perpustakaan?", "o": ["Tiga petak ke kanan", "Tiga petak ke kiri", "Dua petak ke atas", "Lima petak ke bawah"], "a": "A"}, {"n": 12, "q": "Lala membuat bangun gabungan dari satu balok dan satu kubus yang diletakkan tepat di atas balok. Ia kemudian menggambar tampak depan, samping, dan atas. Mengapa ketiga gambar tersebut tidak selalu terlihat sama?", "o": ["Karena setiap pandangan menunjukkan bagian bangun dari arah yang berbeda.", "Karena balok dan kubus tidak dapat digabungkan.", "Karena bangun gabungan hanya memiliki satu sisi.", "Karena gambar tampak atas harus selalu lebih besar."], "a": "A"}, {"n": 13, "q": "Fajar ingin membuat jaring-jaring kubus untuk tugas sekolah. Ia mempunyai empat rancangan. Menurutnya, rancangan yang baik harus terdiri atas enam persegi sama besar dan dapat dilipat tanpa ada sisi yang bertumpuk. Kriteria yang digunakan Fajar tersebut ....", "o": ["Tepat, karena jaring-jaring harus dapat membentuk bangun ruang dengan benar.", "Salah, karena kubus hanya membutuhkan empat persegi.", "Salah, karena jaring-jaring harus berbentuk lingkaran.", "Tepat, karena semua bangun datar dapat menjadi jaring-jaring kubus."], "a": "A"}, {"n": 14, "q": "Ibu ingin membeli kotak penyimpanan. Toko menyediakan kotak berbentuk kubus dan balok. Ibu membutuhkan kotak yang memiliki sisi atas dan bawah berbentuk persegi panjang dengan ukuran panjang lebih besar daripada lebarnya. Bentuk yang paling sesuai adalah ....", "o": ["Kubus, karena seluruh sisinya persegi.", "Balok, karena ukuran panjang dan lebarnya dapat berbeda.", "Segitiga, karena mempunyai tiga sisi.", "Lingkaran, karena mudah disimpan."], "a": "B"}, {"n": 15, "q": "Dua siswa menghitung volume kubus dengan panjang rusuk 3 cm. Riko menjawab 9 cm³, sedangkan Nisa menjawab 27 cm³. Setelah diperiksa, jawaban yang benar adalah ....", "o": ["Riko, karena volume diperoleh dari 3 × 3.", "Nisa, karena volume kubus dihitung dengan mengalikan panjang rusuk sebanyak tiga kali.", "Keduanya benar karena hasilnya hampir sama.", "Keduanya salah karena kubus tidak mempunyai volume."], "a": "B"}, {"n": 16, "q": "Pak Guru meminta siswa membuat bangun gabungan dari kubus dan balok. Kelompok pertama menempatkan kubus di atas balok, sedangkan kelompok kedua menempatkan kubus di samping balok. Kedua kelompok menyatakan hasilnya sama karena menggunakan dua bangun yang sama. Penilaian yang paling tepat adalah ....", "o": ["Benar, karena posisi tidak memengaruhi bentuk gabungan.", "Kurang tepat, karena posisi penyusunan dapat mengubah bentuk dan tampilan bangun gabungan.", "Benar, karena semua bangun gabungan pasti berbentuk kubus.", "Salah, karena kubus tidak boleh digabungkan dengan balok."], "a": "B"}, {"n": 17, "q": "Rina membuat gambar tampak atas dari sebuah susunan kubus. Ia menggambar semua kubus yang terlihat dari depan dan samping juga. Temannya mengatakan gambar tersebut kurang tepat. Alasan yang paling sesuai adalah ....", "o": ["Tampak atas hanya menggambarkan bagian yang terlihat jika bangun diamati dari atas.", "Tampak atas harus menggambarkan semua sisi sekaligus.", "Tampak atas selalu berbentuk lingkaran.", "Tampak atas tidak boleh terdiri atas persegi."], "a": "A"}, {"n": 18, "q": "Sebuah kotak berbentuk kubus mempunyai rusuk 6 cm. Doni ingin memperbesar kotak tersebut menjadi kubus dengan rusuk 12 cm. Doni memperkirakan volumenya hanya menjadi dua kali lipat. Apakah perkiraan Doni benar?", "o": ["Benar, karena panjang rusuknya hanya bertambah dua kali.", "Salah, karena volume kubus berubah mengikuti pangkat tiga panjang rusuknya.", "Benar, karena semua ukuran bertambah satu kali.", "Salah, karena kubus tidak dapat diperbesar."], "a": "B"}, {"n": 19, "q": "Pada denah taman, kolam berada di petak (2,2), sedangkan tempat duduk berada di petak (2,5). Deni mengatakan bahwa tempat duduk berada tiga petak di sebelah kanan kolam. Setelah diperiksa, pernyataan Deni perlu diperbaiki karena ....", "o": ["Tempat duduk berada tiga petak ke atas atau ke bawah, bergantung arah sumbu pada denah.", "Tempat duduk berada tiga petak ke kanan.", "Kedua tempat berada di petak yang sama.", "Denah berpetak tidak dapat menunjukkan lokasi."], "a": "A"}, {"n": 20, "q": "Sebuah kelompok membuat kotak berbentuk balok dari karton. Mereka menggambar dua persegi panjang besar dan empat persegi panjang kecil, kemudian melipatnya. Setelah dilipat, ternyata ada bagian yang tidak tertutup. Evaluasi yang paling tepat untuk memperbaiki pekerjaan mereka adalah ....", "o": ["Menghilangkan semua sisi yang kecil.", "Memeriksa kembali ukuran dan susunan keenam sisi agar dapat menutup seluruh bagian balok.", "Mengganti semua sisi menjadi lingkaran.", "Mengurangi jumlah sisi menjadi empat."], "a": "B"}], "es": [{"n": 21, "q": "Sebuah kubus memiliki panjang rusuk 7 cm. Jika Rudi ingin menghitung volume kubus tersebut, berapakah volume yang diperoleh?", "k": "7 × 7 × 7 = 343 cm³"}, {"n": 22, "q": "Sebuah kotak berbentuk balok mempunyai panjang 12 cm, lebar 8 cm, dan tinggi 5 cm. Sebutkan tiga pasang sisi yang memiliki ukuran sama pada balok tersebut!", "k": "Depan dan belakang, atas dan bawah, kiri dan kanan. Setiap pasangan memiliki ukuran yang sama."}, {"n": 23, "q": "Dina menyusun delapan kubus kecil menjadi bangun gabungan. Ia membuat susunan pertama secara berjajar dan susunan kedua bertingkat. Menurutmu, apakah kedua susunan tersebut memiliki bentuk yang sama? Jelaskan alasanmu!", "k": "Tidak selalu sama. Walaupun jumlah kubus sama, posisi penyusunan dapat menghasilkan bentuk dan tampilan berbeda."}, {"n": 24, "q": "Sebuah kotak berbentuk kubus dibuka hingga menjadi lembaran karton. Setelah dibuka, terlihat enam bidang berbentuk persegi. Jelaskan mengapa keenam bidang tersebut dapat membentuk kembali sebuah kubus jika dilipat dengan benar!", "k": "Karena keenam persegi menjadi sisi-sisi kubus. Jika susunannya tepat, setiap sisi dapat bertemu dan membentuk bangun ruang kubus."}, {"n": 25, "q": "Pada denah sekolah, ruang guru berada di petak (3,2), sedangkan ruang UKS berada di petak (6,2). Jika angka pertama menunjukkan posisi mendatar dan angka kedua menunjukkan posisi tegak, jelaskan letak ruang UKS terhadap ruang guru!", "k": "Ruang UKS berada tiga petak di sebelah kanan ruang guru."}]};

const EX=["Volume kubus = rusuk × rusuk × rusuk, jadi 7 × 7 × 7 = 343 cm³.","Balok punya 3 pasang sisi berhadapan yang sama: 12×8 (atas–bawah), 12×5 (depan–belakang), dan 8×5 (kiri–kanan).","Bentuk bangun ditentukan oleh cara menyusun kubus, bukan hanya jumlahnya. Berjajar dan bertingkat menghasilkan bentuk serta tampak depan/atas yang berbeda.","Enam persegi sama besar adalah enam sisi kubus. Jika dilipat pada tepi yang tepat, sisi-sisinya bertemu di rusuk tanpa celah atau tumpukan.","Angka pertama (mendatar) naik dari 3 ke 6, selisihnya 3 petak ke kanan. Angka kedua (tegak) sama, jadi tidak naik atau turun."];

       * Menghitung Cosine Similarity antara dua vektor numerik.

       * norma kedua vektor bernilai 1, namun pembagian norma tetap disertakan untuk presisi.
       */
      function cosineSimilarity(vecA, vecB) {
        let dotProduct = 0.0;
        let normA = 0.0;
        let normB = 0.0;
        for (let i = 0; i < vecA.length; i++) {
          dotProduct += vecA[i] * vecB[i];
          normA += vecA[i] * vecA[i];
          normB += vecB[i] * vecB[i];
        }
        const denom = Math.sqrt(normA) * Math.sqrt(normB);
        return denom === 0 ? 0 : dotProduct / denom;
      }

       * Memuat pipeline feature-extraction sekali saja (singleton pattern di dalam worker).
       */

          status: 'loading',
          message: 'Menghubungkan ke Hugging Face Hub & memuat ' + MODEL_ID + '...'

          progress_callback: (progressInfo) => {

            self.postMessage({
              type: 'progress',
              data: progressInfo
            });
          }

          type: 'status',
          status: 'ready',
          message: 'Model ' + MODEL_ID + ' siap digunakan di Web Worker!'
        });

      }

            self.postMessage({
              type: 'status',
              status: 'error',
              message: err?.message || 'Gagal memuat model dari Hugging Face.'

            });

        .toLowerCase()
        .replace(/,/g, '.')
        .replace(/[×x\*]/g, '*')

          checks.push({ pass: true, text: 'Validasi Jarak Mendatar: Benar, selisih Δx = 6 − 3 = 3 petak.' });
          checks.push({ pass: true, text: 'Validasi Arah Spasial: Benar, arah bergeser ke sebelah kanan.' });
          reasoningNote = 'Perhitungan selisih koordinat mendatar (6 − 3 = 3 petak) dan arah ke kanan tervalidasi tepat 100%.';
        } else if (hasRight || hasThreeUnits) {
          status = 'partial';
          scoreCap = 60;
          minScoreFloor = 50;
          checks.push({
            pass: hasThreeUnits ? true : 'warn',
            text: hasThreeUnits ? 'Jarak 3 petak (Δx = 6 − 3 = 3) sudah tepat.' : 'Jumlah langkah (3 petak) belum disebutkan.'
          });
          checks.push({
            pass: hasRight ? true : 'warn',
            text: hasRight ? 'Arah ke sebelah kanan sudah tepat.' : 'Arah pergeseran ("sebelah kanan") belum disebutkan.'
          });
          reasoningNote = 'Informasi posisi belum lengkap (harus memuat jarak 3 petak sekaligus arah ke sebelah kanan).';
        } else {
          status = 'invalid';
          scoreCap = 20;
          checks.push({
            pass: false,
            text: 'Validasi Koordinat: Tidak menyebutkan jarak 3 petak maupun arah ke kanan dari (3,2) ke (6,2).'
          });
          reasoningNote = 'Jawaban tidak menunjukkan posisi relatif ruang UKS terhadap ruang guru.';
        }
      }

      // Gabungkan skor E5 dengan batasan (cap/floor) dari hasil validasi matematika & logika
      let rawPoints = 20;
      if (rawSimilarity >= state.thresholdHigh) rawPoints = 100;
      else if (rawSimilarity >= state.thresholdMid) rawPoints = 60;

      const finalPoints = Math.max(minScoreFloor, Math.min(scoreCap, rawPoints));
      const isOverridden = finalPoints !== rawPoints;

      return {
        status,
        finalPoints,
        rawPoints,
        isOverridden,
        checks,
        reasoningNote
      };
    }

    function classifyHybridResult(similarity, validation) {
      if (validation.status === 'invalid' || validation.finalPoints < 40) {
        return {
          label: 'Salah / Kontradiksi Logika-Matematika',
          points: validation.finalPoints,
          badgeClass: 'bg-rose-100 text-rose-800 border border-rose-200',
          barClass: 'bg-rose-500',
          textClass: 'text-rose-700'
        };
      }
      if (validation.status === 'partial' || validation.finalPoints < 85) {
        return {
          label: 'Sebagian Benar / Kurang Lengkap',
          points: validation.finalPoints,
          badgeClass: 'bg-amber-100 text-amber-800 border border-amber-200',
          barClass: 'bg-amber-500',
          textClass: 'text-amber-700'
        };
      }
      return {
        label: 'Benar & Tervalidasi',
        points: validation.finalPoints,
        badgeClass: 'bg-emerald-100 text-emerald-800 border border-emerald-200',
        barClass: 'bg-emerald-500',
        textClass: 'text-emerald-700'
      };
    }
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

if(mState=='ready')setTimeout(()=>{if(mState=='ready')m.classList.add('hide')},2500)}
function setupWorker(){if(W)W.terminate();fp.clear();mState='loading';mPct=4;rdy=new Promise(r=>rdyRes=r);ui();
try{W=new Worker(URL.createObjectURL(new Blob([workerSourceCode],{type:'application/javascript'})),{type:'module'})}catch(e){mState='error';ui();rdyRes(false);return}
W.onmessage=e=>{const{type,status,data,requestId,payload,error}=e.data;
if(type=='status'){if(status=='ready'){mState='ready';ui();rdyRes(true)}else if(status=='error'){mState='error';ui();rdyRes(false)}return}
if(type=='progress'){if(data&&data.file&&typeof data.progress=='number'){fp.set(data.file,data.progress);let s=0;fp.forEach(v=>s+=v);mPct=Math.max(4,s/fp.size);ui()}return}
const p=pend.get(requestId);if(!p)return;pend.delete(requestId);type=='similarity_result'?p.ok(payload):p.no(new Error(error))};
W.onerror=()=>{mState='error';ui();rdyRes(false)};W.postMessage({type:'init'})}
const sim=(a,b)=>new Promise((ok,no)=>{const id=++rq;pend.set(id,{ok,no});W.postMessage({type:'similarity',requestId:id,payload:{referenceText:a,studentText:b}})});
async function grade(q){const t=ans2[q.n];let r=null;if(await rdy){try{r=await sim(q.k,t)}catch(e){}}
const s=r?Math.max(0,Math.min(1,r.similarity)):0,v=validateMathAndReasoning(q.n,t,s),c=classifyHybridResult(s,v);D2[q.n]=1;return{s,v,c,fb:!r}}
